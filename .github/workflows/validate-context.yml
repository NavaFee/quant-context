name: Validate context

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documentation
        run: python3 scripts/verify_context.py
      - name: Run validator self-tests
        run: python3 scripts/verify_context.py --self-test
